<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#155eef">
  <meta name="description" content="AgendaFácil — acesso à plataforma.">
  <title>AgendaFácil — Entrar</title>
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>
  <a class="skip-link" href="#main">Pular para o conteúdo</a>
  <header class="topbar">
    <a class="brand" href="login.html" aria-label="AgendaFácil — página inicial">
      <span class="brand-mark" aria-hidden="true">A</span>
      <span>Agenda<span class="brand-light">Fácil</span></span>
    </a>
  </header>
  <main id="main" class="login-layout">
    <section class="intro-panel" aria-labelledby="welcomeHeading">
      <span class="eyebrow">AGENDAFÁCIL</span>
      <h1 id="welcomeHeading">Organize seu próximo compromisso.</h1>
      <p>Acesse sua conta para continuar.</p>
    </section>
    <section class="panel login-panel" aria-labelledby="loginHeading">
      <h2 id="loginHeading">Entrar</h2>
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="loginEmail">E-mail</label>
          <input id="loginEmail" name="email" type="email" autocomplete="email" inputmode="email" placeholder="voce@exemplo.com" required aria-describedby="loginError loginStatus">
        </div>
        <div class="field">
          <label for="loginPassword">Senha</label>
          <input id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required aria-describedby="loginError">
        </div>
        <p class="form-error" id="loginError" role="alert" hidden></p>
        <button class="button primary full" type="submit">Entrar</button>
        <p class="form-status" id="loginStatus" role="status" aria-live="polite" hidden></p>
      </form>
    </section>
  </main>
  <script src="../js/login.js"></script>
</body>
</html>
