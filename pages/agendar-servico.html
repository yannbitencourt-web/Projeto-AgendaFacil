<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#155eef">
  <meta name="description" content="Escolha o serviço que deseja agendar.">
  <title>AgendaFácil — Agendar serviço</title>
  <link rel="stylesheet" href="../css/agendar-servico.css">
</head>
<body>
  <a class="skip-link" href="#main">Pular para o conteúdo</a>
  <header class="topbar">
    <a class="brand" href="login.html" aria-label="AgendaFácil">
      <span class="brand-mark" aria-hidden="true">A</span>
      <span>Agenda<span class="brand-light">Fácil</span></span>
    </a>
  </header>
  <main id="main" class="booking-layout">
    <section class="booking-panel" aria-labelledby="bookingHeading">
      <span class="eyebrow">AGENDAFÁCIL</span>
      <h1 id="bookingHeading">Agendar serviço</h1>
      <p class="subtitle">Selecione o serviço desejado.</p>
      <form id="bookingForm">
        <fieldset class="service-list">
          <legend class="visually-hidden">Opções de serviço</legend>
          <label class="service-option">
            <input type="radio" name="service" value="corte-de-cabelo" required>
            <span class="radio-mark" aria-hidden="true"></span>
            <span class="service-name">Corte de cabelo</span>
          </label>
          <label class="service-option">
            <input type="radio" name="service" value="manutencao">
            <span class="radio-mark" aria-hidden="true"></span>
            <span class="service-name">Manutenção</span>
          </label>
          <label class="service-option">
            <input type="radio" name="service" value="consultoria">
            <span class="radio-mark" aria-hidden="true"></span>
            <span class="service-name">Consultoria</span>
          </label>
        </fieldset>
        <p class="form-error" id="bookingError" role="alert" hidden>Selecione uma opção para continuar.</p>
        <button class="button primary full" type="submit">Confirmar</button>
      </form>
    </section>
  </main>
  <script src="../js/agendar-servico.js"></script>
</body>
</html>
